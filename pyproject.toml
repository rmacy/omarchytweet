# ryan.xtweet — an Omarchy plugin (see manifest.json for plugin metadata).
# Development metadata only: the plugin is installed by cloning this
# repository and at runtime needs nothing beyond the Python standard
# library and xdg-open. This is not a buildable Python package.

[tool.poetry]
name = "ryan-xtweet"
version = "1.0.0"
description = "X composer Omarchy plugin: browser-intent handoff by default, explicit opt-in paid API posting."
authors = ["Ryan Macy <ryan@macy.dev>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4"
